<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>Context · 阅读开关</title>
<link rel="stylesheet" href="ui.css"><script defer src="js/popup.js"></script></head>
<body class="popup">
<header class="popup-head"><div class="brand"><img src="icons/48.png" width="29" height="29" alt="">Context</div></header>
<main>
  <label class="switch-row" for="enabled"><span>启用阅读助手</span><input class="toggle" type="checkbox" role="switch" id="enabled" disabled></label>
  <label class="switch-row" for="paused"><span>在此网站暂停<small id="site"></small></span><input class="toggle" type="checkbox" role="switch" id="paused" disabled></label>
  <p class="popup-help" id="hint" role="status"></p>
</main>
<footer><button id="settings" class="text-btn">打开设置 <span aria-hidden="true">↗</span></button></footer>
</body></html>
